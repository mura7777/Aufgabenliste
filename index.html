<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Meine Einkaufsliste</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
  <div class="nav-left">🛒 Einkaufsliste</div>
  <button id="menuBtn" class="menu-icon">☰</button>
</nav>

<div id="menu" class="menu hidden">
  <a href="#" id="navHome">🏠 Home</a>
  <a href="#" id="navArchive">📦 Archiv</a>
  <a href="#" id="navAnalyse">📊 Analyse</a>
  <a href="#" id="navFeedback">💬 Feedback</a>
</div>

<div class="container">

  <div class="input-area">
    <input type="text" id="itemInput" placeholder="Artikel eingeben...">
    <input type="number" id="amountInput" placeholder="Menge">
    <select id="unitInput">
      <option value="Stück">Stück</option>
      <option value="g">Gramm</option>
      <option value="kg">Kilogramm</option>
    </select>
    <button id="addBtn" class="add-button">➕</button>
  </div>

  <table id="shoppingTable">
    <thead>
      <tr>
        <th>Artikel</th>
        <th>Menge</th>
        <th>Aktion</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="archivePanel" class="hidden panel">
  <h2>📦 Archiv</h2>
  <table id="archiveTable">
    <thead>
      <tr>
        <th>Artikel</th>
        <th>Menge</th>
        <th>Gekauft am</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
  
<div id="analysePanel" class="hidden panel">
  <h2>📊 Analyse</h2>
  <div id="analyseContent"></div>
</div>

  
  <div id="aiBubble" class="ai-bubble"></div>

</div>

<script src="script.js"></script>
</body>
</html>
