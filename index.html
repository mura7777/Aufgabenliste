<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Meine Einkaufsliste</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="navbar">
  <button id="homeBtn">Home</button>
  <button id="menuBtn">☰</button>
</nav>

<div id="menu" class="menu hidden">
  <a href="#" id="navHome">Home</a>
  <a href="#" id="navArchive">Archiv</a>
  <a href="#" id="navAnalyse">Analyse</a>
  <a href="#" id="navFeedback">Feedback</a>
</div>

<div class="container">

  <div class="title-row">
    <h1>🛒 Meine Einkaufsliste</h1>
    <input type="date" id="filterDate">
  </div>

  <div class="input-area">
    <input type="text" id="itemInput" placeholder="Artikel eingeben...">
    <input type="number" id="amountInput" placeholder="Menge">
    <button id="addBtn">Hinzufügen</button>
  </div>

  <table id="shoppingTable">
    <thead>
      <tr>
        <th>Artikel</th>
        <th>Menge</th>
        <th>Aktion</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script src="script.js"></script>
</body>
</html>
